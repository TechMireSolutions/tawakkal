name: Deploy Tawakkal Store

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script_stop: true
          script: |
            echo "==== 1. Pulling Latest Code ===="
            git config --global --add safe.directory /www/wwwroot/tawakkal.store
            cd /www/wwwroot/tawakkal.store
            git fetch origin main
            git reset --hard origin/main

            echo "==== 2. Backend Deployment ===="
            cd /www/wwwroot/tawakkal.store/tawakkal-backend

            ./venv/bin/pip install --upgrade pip
            ./venv/bin/pip install -r requirements.txt

            # Migrations & Statics
            ./venv/bin/python manage.py migrate
            ./venv/bin/python manage.py collectstatic --noinput

            # Backfill Missing Image Variants
            ./venv/bin/python manage.py generate_variants --force

            # Downscale overly large logos & LCP assets safely
            cat << 'EOF' > /tmp/optimize_lcp_assets.py
            import glob
            from PIL import Image

            def optimize_file(pattern, max_w, quality=80):
                for f in glob.glob(pattern, recursive=True):
                    try:
                        img = Image.open(f)
                        if img.size[0] > max_w:
                            new_h = int(img.size[1] * (max_w / img.size[0]))
                            img = img.resize((max_w, new_h), Image.Resampling.LANCZOS)
                        img.save(f, format='WEBP', quality=quality)
                        print(f"Optimized: {f}")
                    except Exception as err:
                        print(f"Skipping {f}: {err}")

            optimize_file('media/uploads/**/tawakkal-logo.webp', 440, 85)
            optimize_file('media/uploads/**/vol787-6*.webp', 640, 75)
            optimize_file('media/uploads/7b1974d6-9992-4440-8c46-b9bea91c7c88/ELAYA_PRI*.webp', 640, 75)
            optimize_file('media/uploads/0cc5ba0d-5f83-4992-af77-5f9ca20b5e52/ChatGPT_I*.webp', 1280, 72)
            EOF

            ./venv/bin/python /tmp/optimize_lcp_assets.py
            rm -f /tmp/optimize_lcp_assets.py

            # Restart Backend on PM2
            pm2 reload tawakkal-backend || pm2 restart tawakkal-backend

            echo "==== 3. Frontend Deployment ===="
            cd /www/wwwroot/tawakkal.store/tawakkal-frontend
            npm ci
            npm run build

            # Dist aur Assets sync
            rm -rf /www/wwwroot/tawakkal.store/dist/*
            cp -r dist/* /www/wwwroot/tawakkal.store/dist/
            cp -r public/* /www/wwwroot/tawakkal.store/dist/
            mkdir -p /www/wwwroot/tawakkal.store/dist/assets
            cp -r public/* /www/wwwroot/tawakkal.store/dist/assets/

            echo "==== 4. Permissions & Reload Nginx ===="
            mkdir -p /www/wwwroot/tawakkal.store/tawakkal-backend/media /www/wwwroot/tawakkal.store/tawakkal-backend/staticfiles
            chown -R www:www /www/wwwroot/tawakkal.store/dist /www/wwwroot/tawakkal.store/tawakkal-backend
            chmod -R 755 /www/wwwroot/tawakkal.store/dist /www/wwwroot/tawakkal.store/tawakkal-backend/media

            nginx -t && nginx -s reload
            echo "==== Deployment Completed Successfully! ===="