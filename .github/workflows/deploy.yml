name: Deploy Tawakkal Store

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script_stop: true
          script: |
            echo "==== 1. Pulling Latest Code ===="
            git config --global --add safe.directory /www/wwwroot/tawakkal.store
            cd /www/wwwroot/tawakkal.store
            git fetch origin main
            git reset --hard origin/main

            echo "==== 2. Backend Deployment ===="
            cd /www/wwwroot/tawakkal.store/tawakkal-backend

            ./venv/bin/pip install --upgrade pip
            ./venv/bin/pip install -r requirements.txt

            # Migrations & Statics
            ./venv/bin/python manage.py migrate
            ./venv/bin/python manage.py collectstatic --noinput

            # Backfill Missing Image Variants
            ./venv/bin/python manage.py generate_variants --force

            # Downscale overly large logos & LCP assets safely (single-line commands)
            ./venv/bin/python -c "import glob; from PIL import Image; [Image.open(f).resize((440, int(Image.open(f).size[1]*440/Image.open(f).size[0])), Image.Resampling.LANCZOS).save(f, format='WEBP', quality=85) for f in glob.glob('media/uploads/**/tawakkal-logo.webp', recursive=True) if Image.open(f).size[0] > 440]"
            ./venv/bin/python -c "import glob; from PIL import Image; [Image.open(f).resize((640, int(Image.open(f).size[1]*640/Image.open(f).size[0])), Image.Resampling.LANCZOS).save(f, format='WEBP', quality=75) for f in glob.glob('media/uploads/**/vol787-6*.webp', recursive=True) if Image.open(f).size[0] > 640]"
            ./venv/bin/python -c "import glob; from PIL import Image; [Image.open(f).resize((640, int(Image.open(f).size[1]*640/Image.open(f).size[0])), Image.Resampling.LANCZOS).save(f, format='WEBP', quality=75) for f in glob.glob('media/uploads/7b1974d6-9992-4440-8c46-b9bea91c7c88/ELAYA_PRI*.webp', recursive=True) if Image.open(f).size[0] > 640]"
            ./venv/bin/python -c "import glob; from PIL import Image; [Image.open(f).resize((1280, int(Image.open(f).size[1]*1280/Image.open(f).size[0])), Image.Resampling.LANCZOS).save(f, format='WEBP', quality=72) for f in glob.glob('media/uploads/0cc5ba0d-5f83-4992-af77-5f9ca20b5e52/ChatGPT_I*.webp', recursive=True) if Image.open(f).size[0] > 1280]"

            # Restart Backend on PM2
            pm2 reload tawakkal-backend || pm2 restart tawakkal-backend

            echo "==== 3. Frontend Deployment ===="
            cd /www/wwwroot/tawakkal.store/tawakkal-frontend
            npm ci
            npm run build

            # Dist aur Assets sync
            rm -rf /www/wwwroot/tawakkal.store/dist/*
            cp -r dist/* /www/wwwroot/tawakkal.store/dist/
            cp -r public/* /www/wwwroot/tawakkal.store/dist/
            mkdir -p /www/wwwroot/tawakkal.store/dist/assets
            cp -r public/* /www/wwwroot/tawakkal.store/dist/assets/

            echo "==== 4. Permissions & Reload Nginx ===="
            mkdir -p /www/wwwroot/tawakkal.store/tawakkal-backend/media /www/wwwroot/tawakkal.store/tawakkal-backend/staticfiles
            chown -R www:www /www/wwwroot/tawakkal.store/dist /www/wwwroot/tawakkal.store/tawakkal-backend
            chmod -R 755 /www/wwwroot/tawakkal.store/dist /www/wwwroot/tawakkal.store/tawakkal-backend/media

            nginx -t && nginx -s reload
            echo "==== Deployment Completed Successfully! ===="